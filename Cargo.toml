[package]
name = "kicom-tracker"
version = "0.1.16"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmc-wasm-sdk = { git = "https://github.com/BraiinsForge/bmc-main", branch = "bmcpkgs/stable-26.10" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
